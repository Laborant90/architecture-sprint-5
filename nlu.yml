version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день

  - intent: goodbye
    examples: |
      - До свидания
      - Пока
      - Увидимся

  - intent: ask_architecture
    examples: |
      - Расскажите об архитектуре ПО
      - Какие подходы существуют в архитектуре?
      - Как выбрать архитектуру ПО?
      - Архитектура ПО?

  - intent: ask_ms_architecture
    examples: |
      - Что такое микросервисная архитектура?
      - Что такое микросервис?
      - Микросервисы?

  - intent: request_info
    examples: |
      - Расскажите больше об этом
      - Можете уточнить?
      - Какие есть детали?
